services:
  app:
    image: elfmailroom:production
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://elfmailroom.com}
        VITE_BUSINESS_NAME: ${VITE_BUSINESS_NAME:-}
        VITE_BUSINESS_COUNTRY: ${VITE_BUSINESS_COUNTRY:-}
        VITE_BUSINESS_ADDRESS: ${VITE_BUSINESS_ADDRESS:-}
        VITE_BUSINESS_ABN: ${VITE_BUSINESS_ABN:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_PRIVACY_RETENTION: ${VITE_PRIVACY_RETENTION:-}
        VITE_PRIVACY_PROVIDERS: ${VITE_PRIVACY_PROVIDERS:-}
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_PATH: /data/mailroom.sqlite
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/config').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
